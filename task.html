<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Name & Number</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .number {
            font-size: 20px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="name">Nitin Punera</div>
        <div class="number">S24CSEU2518</div>
    </div>

</body>

</html>
